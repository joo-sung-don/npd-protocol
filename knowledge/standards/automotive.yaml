# 자동차 내장재 (시트 라이너, 도어 트림, NVH 부품 등)
- id: FMVSS-302
  title: "FMVSS No. 302 — Flammability of Interior Materials (미국)"
  scope: "차량 실내 재료 수평 연소성"
  use_when: "자동차 실내 부품 전반 (미국 수출 및 국내외 OEM 대부분이 준용)"
  typical_criteria: "연소속도 ≤ 102 mm/min (4 in/min) — OEM 규격은 더 엄격할 수 있음"
  notes: "국내 자동차 안전기준(내장재 난연성)·KS R ISO 3795와 동등 시험 방식"
  status: draft-unverified
- id: ISO-3795
  title: "Road vehicles — Determination of burning behaviour of interior materials"
  scope: "실내 재료 수평 연소"
  use_when: "EU/국제 OEM, FMVSS 302 대응"
  typical_criteria: "OEM 규격 (예: ≤ 100 mm/min 또는 SE/NBR 등급)"
  notes: "KS R ISO 3795. DIN 75200과 같은 방식. 시편 356×100 mm, 두께 ≤13 mm(두꺼우면 13 mm로 가공), 폭이 좁으면 138 mm 길이 허용. 상태조절 23±2°C/50±5% RH, 24 h~7 d. 1989판, 2025년 재확인(현행). 출처: Intertek testlopedia, iso.org/standard/9328 (2026-11-27 조회)"
  status: draft-unverified
- id: KR-VEHICLE-INTERIOR-FLAMMABILITY
  title: "자동차 및 자동차부품의 성능과 기준에 관한 규칙 — 내장재 난연성"
  scope: "국내 차량 실내 내장재 연소성"
  use_when: "국내 판매 차량 부품"
  typical_criteria: "제95조: 좌석·팔걸이·천정·바닥·내부판넬 등 차실 내장재는 매분당 102 mm 이상의 속도로 연소가 진행되지 않을 것"
  notes: "korean-law 원문 조회(2026-11-26, 2026-07-10 시행본). 시행예정 개정 2건(2028-06-06, 2028-07-11) 있음 — 개발 일정과 겹치면 확인"
  status: draft-unverified
- id: KR-NEW-VEHICLE-IAQ
  title: "신규제작자동차 실내공기질 관리기준 (국토교통부 고시 제2022-310호)"
  scope: "신차 실내 8개 물질 농도 권고기준 — 폼알데하이드, 벤젠, 톨루엔, 자일렌, 에틸벤젠, 스티렌, 아크롤레인, 아세트알데하이드"
  use_when: "국내 판매 승용·소형 승합·소형 화물차 실내 부품 — 특히 재생 PET(아세트알데하이드) 사용 시"
  typical_criteria: "별표1 (㎍/㎥): 폼알데하이드 210, 벤젠 30, 톨루엔 1000, 자일렌 870, 에틸벤젠 1000, 스티렌 220, 아크롤레인 50, 아세트알데하이드 300. 차량 단위 측정(별표2: 16±1h 밀폐, KS I ISO 16000-3/-6)"
  notes: "권고기준(의무 아님). 초과 시 개선 권고·결과 공표 가능(제6조, 제6조의2). 부품 단위 한도는 OEM 규격. korean-law get_admin_rule로 원문 조회(2026-11-26)"
  status: draft-unverified
