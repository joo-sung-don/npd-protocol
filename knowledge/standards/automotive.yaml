  notes: "VOC 90°C 30 min → 같은 시료 FOG 120°C 60 min, 불활성가스 약 80 mL/min, 시료당 2회 측정. 시료 질량은 원문 확인 필요. 장비 간 편차가 클 수 있음(SAE 2023-01-5038). 출처: Gerstel, Agilent 5991-8265EN (2026-11-27 조회)"
  status: draft-unverified
