# 환경 노화·내후 — 공통 (조건은 대부분 고객 규격이 정함)
- id: ENV-DAMP-HEAT
  title: "고온고습 노화 (예: IEC 60068-2-78 정상상태 고온고습 / 85°C·85%RH 등)"
  scope: "고온고습 장기 노출 후 물성·외관 변화"
  use_when: "PET 가수분해 리스크 — srPET 전 제품, EcoFlamix 흡습·용출"
  typical_criteria: "노출 후 인장/굴곡/충격 유지율 ≥ 고객 기준(예: 80%) — 기준값은 고객 사양으로 확정"
  notes: "온습도·시간은 적용 산업/고객 규격에서 가져올 것. 가속 시 Peck 모델 등으로 수명 상관"
  status: draft-unverified
- id: ENV-HEAT-AGING
