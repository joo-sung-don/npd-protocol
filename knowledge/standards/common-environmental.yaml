  scope: "고온 장기 노출 후 물성·치수·외관"
  use_when: "자동차 실내(고온), 열수축 리스크"
  typical_criteria: "물성 유지율, 치수 변화율, 외관 등급 — 고객 사양"
  notes: "플라스틱 열노화 일반은 ISO 2578(장기 열노출) 참고"
  status: draft-unverified
